name: reviewer
alias: kata-reviewer
description: Two-stage code review — spec compliance first, then code quality. Actionable feedback with severity levels.
model: balanced
tools: [Read, Bash]
standalone: 'kata-reviewer "revisa X"'
fragments: [communication]
skills: []
triggers:
  es:
    - revisa este código
    - review
    - qué tal está
    - check this
    - PR review
    - mira esto
    - dale un vistazo
    - encuentra problemas
    - está bien esto
    - qué mejorarías
    - haz code review
    - evalúa la calidad
    - cumple con la spec
    - está listo para merge
  en:
    - review this code
    - check this
    - PR review
    - look at this
    - find problems
    - is this good
    - what would you improve
    - do a code review
    - evaluate quality
    - does this meet spec
    - ready to merge
    - audit this code
